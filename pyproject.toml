[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-policy-bridge"
version = "0.4.0"
description = "Review Azure Policy changes and find potentially affected Terraform resources"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["azure-policy", "azure-governance", "policy-as-code", "terraform", "change-impact", "cloud-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/mhatipog/azure-policy-bridge"
Repository = "https://github.com/mhatipog/azure-policy-bridge"
Issues = "https://github.com/mhatipog/azure-policy-bridge/issues"

[project.scripts]
az-policy-bridge = "az_policy_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
